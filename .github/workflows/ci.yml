name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Sem banco no CI: generate/typecheck/test/build não conectam.
      DATABASE_URL: ""
      DIRECT_URL: ""
      AUTH_SECRET: "ci-placeholder-secret-not-used-at-runtime"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    # Testes end-to-end rodam contra um build de produção e um Postgres real:
    # é a única forma de exercitar a autenticação (fora de produção o sistema
    # a desliga) e os guards de servidor.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: emendas
          POSTGRES_DB: emendas_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:emendas@localhost:5433/emendas_test
      DATABASE_URL: postgresql://postgres:emendas@localhost:5433/emendas_test
      DIRECT_URL: postgresql://postgres:emendas@localhost:5433/emendas_test
      AUTH_SECRET: ci-e2e-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
